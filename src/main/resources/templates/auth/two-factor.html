<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Library - Verificação em Duas Etapas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .otp-input {
            letter-spacing: 8px;
            font-size: 1.5rem;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-4">
            <div class="card shadow-sm border-0 rounded-3 p-4">

                <div class="text-center mb-4">
                    <div class="badge bg-primary-subtle text-primary p-3 rounded-circle mb-2">
                        <i class="bi bi-shield-check fs-3"></i>
                    </div>
                    <h4 class="fw-bold text-dark">Autenticação 2FA</h4>
                    <p class="text-muted small">Digite o código de verificação de 6 dígitos gerado para a sua sessão</p>
                </div>

                <!-- Mensagem de erro -->
                <div th:if="${error}" class="alert alert-danger small py-2" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${error}"></span>
                </div>

                <!-- Formulário de validação do código -->
                <form method="POST" th:action="@{/login-2fa}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="mb-3">
                        <label for="code" class="form-label small fw-semibold text-secondary">Código de 6 dígitos</label>
                        <input type="text"
                               class="form-control otp-input"
                               id="code"
                               name="code"
                               maxlength="6"
                               placeholder="000000"
                               autocomplete="one-time-code"
                               required
                               autofocus>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary py-2 fw-semibold">
                            <i class="bi bi-unlock me-1"></i> Validar e Acessar
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4 border-top pt-3">
                    <small class="text-muted">Deseja cancelar? <a th:href="@{/logout}" class="text-danger text-decoration-none fw-semibold">Sair</a></small>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
