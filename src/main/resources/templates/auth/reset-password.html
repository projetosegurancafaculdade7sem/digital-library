<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Library - Redefinir Senha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-4">
            <div class="card shadow-sm border-0 rounded-3 p-4">

                <div class="text-center mb-4">
                    <div class="badge bg-success-subtle text-success p-3 rounded-circle mb-2">
                        <i class="bi bi-shield-lock-fill fs-3"></i>
                    </div>
                    <h4 class="fw-bold text-dark">Nova Senha</h4>
                    <p class="text-muted small">Digite a nova senha para sua conta</p>
                </div>

                <div th:if="${error}" class="alert alert-danger small py-2" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <span th:text="${error}"></span>
                </div>

                <form method="POST" th:action="@{/reset-password}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="hidden" name="email" th:value="${email}" />

                    <div class="mb-3">
                        <label for="password" class="form-label small fw-semibold text-secondary">Nova Senha</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted"><i class="bi bi-key"></i></span>
                            <input type="password"
                                   class="form-control"
                                   id="password"
                                   name="password"
                                   placeholder="Mínimo 8 caracteres"
                                   minlength="8"
                                   required>
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-success py-2 fw-semibold text-white">
                            <i class="bi bi-check2-circle me-1"></i> Atualizar Senha
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4 border-top pt-3">
                    <small class="text-muted"><a th:href="@{/login}" class="text-primary text-decoration-none fw-semibold">Voltar para o Login</a></small>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
