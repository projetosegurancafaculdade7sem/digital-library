<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Library - Cadastro Acadêmico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card shadow-sm border-0 rounded-3 p-4">

                <div class="text-center mb-4">
                    <div class="badge bg-primary-subtle text-primary p-3 rounded-circle mb-2">
                        <i class="bi bi-person-plus-fill fs-3"></i>
                    </div>
                    <h4 class="fw-bold text-dark">Criar Conta</h4>
                    <p class="text-muted small">Preencha seus dados para acesso à biblioteca digital</p>
                </div>

                <!-- Bloco de Alerta de Erro -->
                <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center small py-2" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <div th:text="${errorMessage}">Mensagem de erro</div>
                </div>

                <form method="POST" th:action="@{/register}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Nome Completo</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" name="name" class="form-control" placeholder="Seu nome completo" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">E-mail Acadêmico</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email" name="email" class="form-control" placeholder="estudante@faculdade.edu.br" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Senha</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted"><i class="bi bi-key"></i></span>
                            <input type="password" name="password" minlength="8" class="form-control" placeholder="Mínimo 8 caracteres" required>
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary py-2 fw-semibold">
                            <i class="bi bi-check-circle me-1"></i> Finalizar Cadastro
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4 border-top pt-3">
                    <small class="text-muted">Já possui conta? <a th:href="@{/login}" href="/login" class="text-primary text-decoration-none fw-semibold">Fazer Login</a></small>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
