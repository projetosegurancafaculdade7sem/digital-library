<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Library - Recuperação de Senha</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-4">
            <div class="card shadow-sm border-0 rounded-3 p-4">

                <div class="text-center mb-4">
                    <div class="badge bg-warning-subtle text-warning p-3 rounded-circle mb-2">
                        <i class="bi bi-key-fill fs-3"></i>
                    </div>
                    <h4 class="fw-bold text-dark">Recuperar Senha</h4>
                    <p class="text-muted small">Informe seu e-mail cadastrado para receber o link de recuperação</p>
                </div>

                <!-- Mensagem de confirmação de envio -->
                <div th:if="${param.sent}" class="alert alert-success small py-2" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <div>Se o e-mail estiver cadastrado, um link de redefinição foi enviado com sucesso.</div>
                </div>

                <!-- Formulário de Solicitação -->
                <form method="POST" th:action="@{/forgot-password}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold text-secondary">E-mail Acadêmico</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   name="email"
                                   placeholder="estudante@faculdade.edu.br"
                                   required
                                   autocomplete="email">
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-warning py-2 fw-semibold text-dark">
                            <i class="bi bi-send me-1"></i> Enviar Instruções
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4 border-top pt-3">
                    <small class="text-muted">Lembrou a senha? <a th:href="@{/login}" class="text-primary text-decoration-none fw-semibold">Voltar ao Login</a></small>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
