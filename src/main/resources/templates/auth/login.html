<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Library - Login Acadêmico Seguro</title>

    <!-- Bootstrap 5 CSS para interface moderna e responsiva -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100 py-4">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-4">

            <!-- Card Central de Login -->
            <div class="card shadow-sm border-0 rounded-3 p-4">

                <!-- Cabeçalho com Identidade Visual -->
                <div class="text-center mb-4">
                    <div class="badge bg-primary-subtle text-primary p-3 rounded-circle mb-2">
                        <i class="bi bi-book-half fs-3"></i>
                    </div>
                    <h4 class="fw-bold text-dark">Digital Library</h4>
                    <p class="text-muted small">Autenticação Primária de Usuário</p>
                </div>

                <!-- ========================================================================= -->
                <!-- BLOCO DE ALERTAS E FEEDBACK DE SEGURANÇA (Atende aos Requisitos 1.8 e 1.11) -->
                <!-- ========================================================================= -->

                <!-- Alerta 1: Credenciais Inválidas -->
                <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center small py-2" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <div>E-mail ou senha incorretos.</div>
                </div>

                <!-- Alerta 2: Sessão Encerrada / Logout (Requisito 1.10) -->
                <div th:if="${param.logout}" class="alert alert-info d-flex align-items-center small py-2" role="alert">
                    <i class="bi bi-info-circle-fill me-2"></i>
                    <div>Sessão invalidada com sucesso.</div>
                </div>

                <!-- Alerta 3: Sessão Expirada por Inatividade (Requisito 1.9) -->
                <div th:if="${param.expired}" class="alert alert-warning d-flex align-items-center small py-2" role="alert">
                    <i class="bi bi-clock-history me-2"></i>
                    <div>Sua sessão expirou por inatividade. Faça login novamente.</div>
                </div>

                <!-- Alerta 4: Bloqueio por Força Bruta / Rate Limiting (Requisito 1.11) -->
                <div th:if="${param.locked}" class="alert alert-danger d-flex align-items-center small py-2" role="alert">
                    <i class="bi bi-shield-x me-2"></i>
                    <div>Múltiplas tentativas incorretas. Conta bloqueada temporariamente.</div>
                </div>

                <!-- ========================================================================= -->
                <!-- FORMULÁRIO DE AUTENTICAÇÃO PRIMÁRIA (Etapa 1 do fluxo 2FA - Requisito 1.6) -->
                <!-- ========================================================================= -->
                <form method="POST" th:action="@{/auth/login}">

                    <!-- Proteção contra Cross-Site Request Forgery (CSRF) via Spring Security -->
                    <!-- O token CSRF garante que a requisição partiu legitimamente desta página -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <!-- Campo de Usuário / E-mail -->
                    <div class="mb-3">
                        <label for="username" class="form-label small fw-semibold text-secondary">E-mail Acadêmico</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email"
                                   class="form-control"
                                   id="username"
                                   name="username"
                                   placeholder="estudante@faculdade.edu.br"
                                   required
                                   autocomplete="username">
                        </div>
                    </div>

                    <!-- Campo de Senha -->
                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <label for="password" class="form-label small fw-semibold text-secondary">Senha</label>
                            <a href="/auth/forgot-password" class="text-decoration-none small text-muted" style="font-size: 0.8rem;">Esqueceu a senha?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-muted"><i class="bi bi-key"></i></span>
                            <input type="password"
                                   class="form-control"
                                   id="password"
                                   name="password"
                                   placeholder="••••••••"
                                   required
                                   autocomplete="current-password">
                        </div>
                    </div>

                    <!-- Botão de Submissão -->
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary py-2 fw-semibold">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Avançar para 2FA
                        </button>
                    </div>
                </form>

                <!-- Redirecionamento para Cadastro -->
                <div class="text-center mt-4 border-top pt-3">
                    <small class="text-muted">Não possui cadastro? <a href="/auth/register" class="text-primary text-decoration-none fw-semibold">Cadastre-se</a></small>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
