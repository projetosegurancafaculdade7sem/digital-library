spring.application.name=demo

# ==========================================================
# SERVIDOR / TLS (itens 3 e 6 do parecer)
# Nenhuma chave, senha ou keystore e versionado. Valores vem de ENV/secret manager.
# Todo placeholder tem default vazio: assim uma variavel ausente nunca gera
# PlaceholderResolutionException na avaliacao de condicoes do Spring (ex.:
# MailSenderAutoConfiguration) antes do StartupSecurityValidator rodar.
# Em PaaS como o Render o TLS e terminado no proxy: defina
# SERVER_SSL_ENABLED=false e SECURITY_TLS_REQUIRE=false.
# ==========================================================
server.port=${PORT:8443}
server.http.port=${SERVER_HTTP_PORT:8080}
server.ssl.enabled=${SERVER_SSL_ENABLED:true}
server.ssl.key-store=${SERVER_SSL_KEY_STORE:}
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=${SERVER_SSL_KEY_ALIAS:digital-library}
server.forward-headers-strategy=framework

# Cookies de sessao somente HTTPS e nao acessiveis a JavaScript
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=Lax
server.servlet.session.timeout=15m

# ==========================================================
# BANCO DE DADOS - PostgreSQL (Supabase e um servico, nao um motor diferente)
# ==========================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driverClassName=org.postgresql.Driver

# Nunca alterar o schema automaticamente em producao. Use docs/sql/*.sql.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.flyway.enabled=false

# ==========================================================
# CRIPTOGRAFIA / AUDITORIA
# ==========================================================
security.argon2.salt-length=16
security.argon2.hash-length=32
security.argon2.parallelism=1
security.argon2.memory=65536
security.argon2.iterations=3

# AES-256-GCM (32 bytes em Base64) e HMAC-SHA256 da cadeia de auditoria.
security.encryption.key-base64=${SECURITY_ENCRYPTION_KEY_BASE64:}
security.audit.hmac-key-base64=${SECURITY_AUDIT_HMAC_KEY_BASE64:}

# Validacoes de inicializacao (falham o boot se TLS/SSL nao estiver correto)
security.tls.require=${SECURITY_TLS_REQUIRE:true}
security.datasource.ssl-required=${SECURITY_DATASOURCE_SSL_REQUIRED:true}

# Emails com permissao administrativa (separados por virgula), fora do banco.
security.admin.emails=${SECURITY_ADMIN_EMAILS:}

# ==========================================================
# SMTP / E-MAIL ( credenciais EXCLUSIVAMENTE via ENV )
# ==========================================================
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_SSL_TRUST:}
mail.from=${MAIL_FROM:}
mail.reset.base-url=${MAIL_RESET_BASE_URL:}

# ==========================================================
# LOGS (sem credenciais e sem dados pessoais em DEBUG em producao)
# ==========================================================
logging.level.org.springframework.security=INFO
logging.level.com.example.demo=INFO
