spring.application.name=demo

# --- HTTPS / TLS (req. 3.1 / 3.2) ---
server.port=8443
server.http.port=8080
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=digitallibrary

# Sessao: expiracao em 15 minutos (req. 1.9)
server.servlet.session.timeout=15m

# ==========================================
# CONEXÃO COM SUPABASE (POSTGRESQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=***REMOVED***
spring.datasource.password=***REMOVED***

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desativa H2 e Flyway
spring.h2.console.enabled=false
spring.flyway.enabled=false

# Logs de Segurança
logging.level.org.springframework.security=DEBUG
logging.level.com.example.demo=DEBUG

# Argon2id - justificativa em SecurityBeansConfig e docs/SEGURANCA.md (req. 1.2)
security.argon2.salt-length=16
security.argon2.hash-length=32
security.argon2.parallelism=1
security.argon2.memory=65536
security.argon2.iterations=3

# AES-256 key (Base64 de 32 bytes). Em producao: env SECURITY_ENCRYPTION_KEY_BASE64 (req. 3.6)
security.encryption.key-base64=${SECURITY_ENCRYPTION_KEY_BASE64:***REMOVED***}

# Mailtrap (SMTP com STARTTLS - protege e-mail, nao substitui HTTPS da app)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=***REMOVED***
spring.mail.password=***REMOVED***
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=no-reply@digital-library.com