spring.application.name=demo
server.servlet.session.timeout=15m

# Banco de dados H2 persistido em arquivo local compatível com H2 v2.x
spring.datasource.url=jdbc:h2:file:./data/librarydb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs de Segurança
logging.level.org.springframework.security=DEBUG
logging.level.com.example.demo=DEBUG

# Argon2id Params
security.argon2.salt-length=16
security.argon2.hash-length=32
security.argon2.parallelism=1
security.argon2.memory=65536
security.argon2.iterations=3