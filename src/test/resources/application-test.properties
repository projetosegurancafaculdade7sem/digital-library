# Perfil de testes (classpath de teste tem precedencia sobre src/main/resources).
# As variaveis de sistema configuradas no surefire (pom.xml) tem precedencia sobre ENV,
# garantindo que NENHUM teste conecte em banco externo.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
server.port=0
server.ssl.enabled=false
server.servlet.session.cookie.secure=false
security.tls.require=false
security.datasource.ssl-required=false
security.encryption.key-base64=ZiMgxRPJ7W+3baJZGdHMKLU5AenG3EPbiA1p64asM6Q=
security.audit.hmac-key-base64=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
security.admin.emails=admin@faculdade.edu.br
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.starttls.enable=false
mail.from=no-reply@localhost
mail.reset.base-url=https://localhost/reset-password?token=
