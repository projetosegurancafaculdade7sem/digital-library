# Blueprint do Render. O TLS e terminado no proxy da plataforma, portanto a
# aplicacao roda em HTTP interno e confia em X-Forwarded-Proto (já configurado
# em application.properties via server.forward-headers-strategy=framework).
# Segredos ficam com sync: false e devem ser preenchidos no painel do Render.
services:
  - type: web
    name: digital-library
    runtime: java
    plan: free
    buildCommand: chmod +x ./mvnw && ./mvnw -B clean package -DskipTests
    startCommand: java -jar target/*.jar
    envVars:
      - key: SERVER_SSL_ENABLED
        value: "false"
      - key: SECURITY_TLS_REQUIRE
        value: "false"
      - key: SECURITY_DATASOURCE_SSL_REQUIRED
        value: "true"
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SECURITY_ENCRYPTION_KEY_BASE64
        sync: false
      - key: SECURITY_AUDIT_HMAC_KEY_BASE64
        sync: false
      - key: SPRING_MAIL_HOST
        sync: false
      - key: SPRING_MAIL_PORT
        value: "587"
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_RESET_BASE_URL
        sync: false
      - key: SECURITY_ADMIN_EMAILS
        sync: false
