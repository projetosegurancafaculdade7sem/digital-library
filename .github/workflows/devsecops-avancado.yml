
name: DevSecOps Avancado - DAST, Privacidade e SBOM

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:

  # ---------------------------------------------------
  # 1. SCANNER DE PRIVACIDADE E DADOS (BEARER)
  # ---------------------------------------------------
  bearer:
    name: Privacidade e LGPD (Bearer)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Rodar Bearer Scan
        uses: bearer/bearer-action@v2
        with:
          diff: false
          severity: critical,high
          exit-code: 1

  # ---------------------------------------------------
  # 2. SUPPLY CHAIN SECURITY (TRIVY SBOM)
  # ---------------------------------------------------
  trivy-sbom:
    name: Gerar SBOM (Trivy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      # Restaura o cache Maven antes de baixar dependencias
      - name: Configurar Java e Cache do Maven
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Preenche o repositorio local do Maven
      - name: Baixar dependencias do Maven
        run: |
          mvn -B -ntp dependency:go-offline

      # Confirma que o cache foi criado
      - name: Verificar cache Maven
        run: |
          if [ ! -d "$HOME/.m2/repository" ]; then
            echo "ERRO: Cache Maven nao encontrado!"
            exit 1
          fi

          echo "Cache Maven encontrado:"
          du -sh "$HOME/.m2/repository"

      # Baixa a imagem oficial do Trivy
      - name: Baixar imagem oficial do Trivy
        run: docker pull aquasec/trivy:0.76.1

      # Gera SBOM utilizando o cache Maven do runner
      - name: Gerar SBOM CycloneDX com Trivy
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -v "$HOME/.m2:/root/.m2:ro" \
            -w /work \
            aquasec/trivy:0.76.1 \
            fs \
            --offline-scan \
            --format cyclonedx \
            --output sbom-cyclonedx.json \
            .

      # Verifica se o SBOM foi criado
      - name: Verificar arquivo SBOM
        run: |
          if [ ! -s sbom-cyclonedx.json ]; then
            echo "ERRO: Arquivo SBOM nao foi gerado!"
            exit 1
          fi

          echo "SBOM gerado com sucesso!"
          ls -lh sbom-cyclonedx.json

      # Disponibiliza o arquivo para download
      - name: Disponibilizar Artefato JSON
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifact
          path: sbom-cyclonedx.json
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------
  # 3. DAST (OWASP ZAP)
  # ---------------------------------------------------
  zap-dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root -d demo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Dar permissao na pasta para o ZAP
        run: chmod 777 .

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compilar a aplicacao
        run: mvn -B -ntp clean package -DskipTests

      - name: Subir aplicacao em Background
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/demo
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
          SPRING_MAIL_USERNAME: dummy
          SPRING_MAIL_PASSWORD: dummy
          SECURITY_ENCRYPTION_KEY_BASE64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: |
          java -jar target/*.jar \
            --server.port=8080 \
            --server.ssl.enabled=false \
            > spring-boot.log 2>&1 &

      - name: Aguardar aplicacao ficar disponivel
        run: |
          for i in $(seq 1 40); do

            code=$(curl -s -o /dev/null \
              -w "%{http_code}" \
              http://localhost:8080/ || true)

            if [ "$code" != "000" ]; then
              echo "Aplicacao respondeu (HTTP $code)"
              exit 0
            fi

            echo "Aguardando aplicacao... ($i/40)"
            sleep 3
          done

          echo "Aplicacao nao subiu. Log:"
          cat spring-boot.log
          exit 1

      - name: Criar regras do ZAP
        run: |
          printf '40012\tFAIL\t(Cross Site Scripting - Reflected)\n' > zap-rules.tsv
          printf '40014\tFAIL\t(Cross Site Scripting - Persistent)\n' >> zap-rules.tsv
          printf '40018\tFAIL\t(SQL Injection)\n' >> zap-rules.tsv
          printf '90019\tFAIL\t(Server Side Code Injection)\n' >> zap-rules.tsv
          printf '90020\tFAIL\t(Remote OS Command Injection)\n' >> zap-rules.tsv
          printf '6\tFAIL\t(Path Traversal)\n' >> zap-rules.tsv

      - name: Rodar Varredura Dinamica (OWASP ZAP Baseline)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:8080/'
          rules_file_name: 'zap-rules.tsv'
          cmd_options: '-I'
          fail_action: true
          allow_issue_writing: false

      - name: Mostrar log da aplicacao em caso de falha
        if: failure()
        run: cat spring-boot.log
