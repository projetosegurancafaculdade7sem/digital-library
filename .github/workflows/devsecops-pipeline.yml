name: DevSecOps Pipeline - SAST, SCA e Secrets

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  secrets-scanning:
    name: Secrets Scanning (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
      
      - name: Varredura de Segredos 
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true 
        with:
          path: ./
          extra_args: --only-verified

  sca-trivy:
    name: SCA Dependências (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        
      # --- CORREÇÃO: Configurar Java e Cache do Maven antes do Trivy ---
      - name: Configurar Java e Cache do Maven
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          
      - name: Baixar dependências offline
        run: mvn dependency:go-offline
      # ------------------------------------------------------------------
      
      - name: Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: true 
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1' 
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL' 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-semgrep:
    name: SAST Análise Estática (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        
      - name: Rodar Semgrep CI
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: >-
            p/java
            p/spring-boot
            p/security-audit
